<!DOCTYPE html>
<html lang="{{ session.get('lang', 'en') }}" dir="{{ 'rtl' if session.get('lang') == 'he' else 'ltr' }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taro - {{ t('note_label') }}</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');
        * { box-sizing: border-box; }

        body {
            background-color: #05080a;
            color: #b6ffe0;
            font-family: 'Share Tech Mono', monospace;
            text-align: center;
            padding: 40px 20px;
            min-height: 100vh;
        }

        h1 {
            font-size: 1.8em;
            letter-spacing: 4px;
            color: #39ffb0;
            text-shadow: 0 0 5px #39ffb0, 0 0 20px #17d9a3;
            margin-bottom: 25px;
        }

        form {
            max-width: 500px;
            margin: 0 auto;
            text-align: left;
        }

        html[dir="rtl"] form { text-align: right; }

        textarea {
            width: 100%;
            min-height: 180px;
            padding: 10px;
            border-radius: 4px;
            border: 1px solid #1f5b45;
            background: rgba(0, 20, 15, 0.5);
            color: #d9fff0;
            font-family: 'Share Tech Mono', monospace;
            resize: vertical;
        }

        #char-count {
            text-align: right;
            font-size: 0.75em;
            color: #6b8f83;
            margin-top: 4px;
        }
        html[dir="rtl"] #char-count { text-align: left; }

        .current-image {
            margin-top: 15px;
            text-align: center;
        }

        .current-image img {
            max-width: 200px;
            border-radius: 4px;
            border: 1px solid #39ffb0;
        }

        label {
            display: block;
            margin-top: 15px;
            font-size: 0.85em;
            letter-spacing: 1px;
            color: #b3c9c0;
            text-transform: uppercase;
        }

        input[type="file"] {
            margin-top: 6px;
            color: #b3c9c0;
            font-family: 'Share Tech Mono', monospace;
        }

        button, a.button {
            display: inline-block;
            background: transparent;
            color: #39ffb0;
            border: 1px solid #39ffb0;
            text-decoration: none;
            padding: 10px 20px;
            font-family: 'Share Tech Mono', monospace;
            font-size: 0.85em;
            letter-spacing: 1px;
            border-radius: 2px;
            cursor: pointer;
            margin: 15px 8px 0 0;
        }
        button:hover, a.button:hover { border-color: #e0a458; color: #e0a458; }

        .checkbox-row {
            margin-top: 8px;
            font-size: 0.85em;
            color: #c9e8dd;
        }
    </style>
</head>
<body>
    <h1>{{ t('note_label') }}</h1>

    <div style="margin-bottom: 15px;">
        <a href="/set_language/en?next={{ request.path }}" class="button">EN</a>
        <a href="/set_language/he?next={{ request.path }}" class="button">עב</a>
        <a href="/set_language/uk?next={{ request.path }}" class="button">УК</a>
    </div>

    <form method="POST" enctype="multipart/form-data" id="note-form">
        <textarea name="note_text" id="note_text" maxlength="6000" placeholder="...">{{ reading[6] or '' }}</textarea>
        <div id="char-count">0 / 6000</div>

        {% if reading[7] %}
        <div class="current-image">
            <img src="{{ reading[7] }}" alt="note image">
            <div class="checkbox-row">
                <label><input type="checkbox" name="remove_image" value="1"> {{ t('remove_image') }}</label>
            </div>
            <input type="hidden" name="keep_existing_image" value="1">
        </div>
        {% endif %}

        <label for="note_image_input">{{ t('add_image') }}</label>
        <input type="file" name="note_image" id="note_image_input" accept="image/*">

        <input type="hidden" name="image_position" id="image_position" value="{{ reading[8] if reading[8] is not none else '' }}">
        <div>
            <button type="button" id="mark-position-btn">{{ t('insert_image_here') }}</button>
        </div>

        <div>
            <button type="submit">{{ t('save') }}</button>
            <a class="button" href="/history/{{ reading[1] }}">{{ t('cancel') }}</a>
        </div>
    </form>

    <script>
        const textarea = document.getElementById('note_text');
        const posField = document.getElementById('image_position');
        const markBtn = document.getElementById('mark-position-btn');
        const charCount = document.getElementById('char-count');

        function updateCount() {
            charCount.textContent = textarea.value.length + ' / 6000';
        }
        textarea.addEventListener('input', updateCount);
        updateCount();

        markBtn.addEventListener('click', function () {
            posField.value = textarea.selectionStart;
            markBtn.textContent = "{{ t('image_position_set') }}";
        });
    </script>
</body>
</html>
