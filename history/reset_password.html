{% extends "base.html" %}

{% block title %}Taro - Reset Password{% endblock %}

{% block content %}
    <h1>{{ t('set_new_password') }}</h1>

    {% if invalid %}
        <p class="error">{{ t('reset_link_invalid') }}</p>
        <p><a href="/forgot_password">{{ t('request_new_link') }}</a></p>
    {% else %}
        {% if error %}
        <p class="error">{{ error }}</p>
        {% endif %}

        <form action="/reset_password/{{ token }}" method="POST">
            <label for="new_password">{{ t('new_password_label') }}</label>
            <input type="password" id="new_password" name="password" required>

            <label for="new_password_confirm">{{ t('confirm_new_password_label') }}</label>
            <input type="password" id="new_password_confirm" name="password_confirm" required>

            <br>
            <button type="submit">{{ t('reset_password_btn') }}</button>
        </form>
    {% endif %}
{% endblock %}
