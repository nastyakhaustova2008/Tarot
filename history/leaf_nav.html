<style>
    .nav-toggle-checkbox { display: none; }

    .nav-toggle-icon {
        position: fixed;
        bottom: 20px;
        right: 20px;
        z-index: 1001;
        width: 56px;
        height: 56px;
        cursor: pointer;
        filter: drop-shadow(0 0 6px rgba(57, 255, 176, 0.6));
        transition: transform 0.2s ease;
    }
    .nav-toggle-icon svg { width: 100%; height: 100%; }
    .nav-toggle-icon:hover { transform: scale(1.08); }

    html[dir="rtl"] .nav-toggle-icon { right: auto; left: 20px; }

    .nav-menu {
        position: fixed;
        bottom: 85px;
        right: 20px;
        z-index: 1000;
        display: flex;
        flex-direction: column;
        gap: 6px;
        align-items: flex-end;
        max-height: 0;
        opacity: 0;
        overflow: hidden;
        pointer-events: none;
        transition: max-height 0.25s ease, opacity 0.2s ease;
    }

    html[dir="rtl"] .nav-menu { right: auto; left: 20px; align-items: flex-start; }

    .nav-toggle-checkbox:checked ~ .nav-menu {
        max-height: 400px;
        opacity: 1;
        pointer-events: auto;
    }

    .nav-menu a {
        background: rgba(5, 8, 10, 0.9);
        color: #39ffb0;
        border: 1px solid #39ffb0;
        text-decoration: none;
        padding: 8px 16px;
        font-family: 'Share Tech Mono', monospace;
        font-size: 0.8em;
        letter-spacing: 1px;
        border-radius: 4px;
        text-shadow: 0 0 4px rgba(57, 255, 176, 0.6);
        box-shadow: 0 0 8px rgba(0, 0, 0, 0.8);
        white-space: nowrap;
        transition: all 0.15s ease-in-out;
    }

    .nav-menu a:hover {
        background: rgba(224, 164, 88, 0.1);
        border-color: #e0a458;
        color: #e0a458;
    }

    .nav-menu a.nav-menu-home {
        border-color: #e0a458;
        color: #e0a458;
        margin-top: 4px;
    }

    @media (max-width: 600px) {
        .nav-toggle-icon { bottom: 12px; right: 12px; width: 48px; height: 48px; }
        html[dir="rtl"] .nav-toggle-icon { right: auto; left: 12px; }
        .nav-menu { bottom: 70px; right: 12px; }
        html[dir="rtl"] .nav-menu { right: auto; left: 12px; }
    }
</style>

<input type="checkbox" id="nav-toggle" class="nav-toggle-checkbox">
<label for="nav-toggle" class="nav-toggle-icon" title="{{ t('back_to_taro') }}">
    <svg viewBox="0 0 80 100" xmlns="http://www.w3.org/2000/svg">
        <path d="M5 45 C5 15 75 15 75 45 C55 35 25 35 5 45 Z" fill="#39ffb0"/>
        <circle cx="20" cy="28" r="4" fill="#05080a" opacity="0.5"/>
        <circle cx="45" cy="20" r="3" fill="#05080a" opacity="0.5"/>
        <circle cx="60" cy="30" r="3.5" fill="#05080a" opacity="0.5"/>
        <rect x="32" y="45" width="16" height="45" rx="6" fill="#d8cba8"/>
    </svg>
</label>

<nav class="nav-menu">
    <a href="/history/past">{{ t('past') }}</a>
    <a href="/history/present">{{ t('present') }}</a>
    <a href="/history/future">{{ t('future') }}</a>
    <a href="/history/oracle">{{ t('oracle') }}</a>
    <a href="/history/yes_no">{{ t('yes_no_history') }}</a>
    <a href="/history/question">{{ t('question_asked') }}</a>
    <a href="/history/two_person">{{ t('prediction_for_two') }}</a>
    <a href="/" class="nav-menu-home">{{ t('back_to_taro') }}</a>
</nav>
