<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taro - Login</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');

        * {
            box-sizing: border-box;
        }

        body {
            background-color: #05080a;
            background-image:
                radial-gradient(circle at 20% 20%, rgba(0, 255, 170, 0.03), transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(224, 164, 88, 0.03), transparent 45%);
            color: #6b8f83;
            font-family: 'Share Tech Mono', monospace;
            text-align: center;
            padding: 60px 20px;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        /* subtle scan lines over everything */
        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: repeating-linear-gradient(
                to bottom,
                rgba(0, 255, 170, 0.015),
                rgba(0, 255, 170, 0.015) 1px,
                transparent 2px,
                transparent 4px
            );
            pointer-events: none;
            z-index: 999;
        }

        .decor {
            position: fixed;
            pointer-events: none;
            z-index: 0;
            opacity: 0.12;
        }
        .decor svg { display: block; }

        .decor-leaf-tl     { top: -20px; left: -30px; width: 160px; transform: rotate(-15deg); }
        .decor-leaf-br     { bottom: -30px; right: -20px; width: 200px; transform: rotate(160deg); }
        .decor-leaf-tr2    { top: 60px; right: 40px; width: 90px; transform: rotate(60deg); opacity: 0.08; }
        .decor-leaf-bl2    { bottom: 120px; left: 30px; width: 80px; transform: rotate(-70deg); opacity: 0.08; }

        .decor-branch-tr   { top: 0; right: 0; width: 220px; opacity: 0.1; }
        .decor-branch-tl   { top: 0; left: 0; width: 180px; opacity: 0.07; transform: scaleX(-1); }
        .decor-branch-bl   { bottom: 0; left: 0; width: 200px; opacity: 0.08; transform: rotate(180deg); }

        .decor-mushroom-bl  { bottom: 0; left: 10px; width: 90px; opacity: 0.15; }
        .decor-mushroom-br  { bottom: 0; right: 20px; width: 70px; opacity: 0.13; }

        .decor-vine-left   { top: 0; left: 0; width: 40px; height: 100vh; opacity: 0.07; }
        .decor-vine-right  { top: 0; right: 0; width: 40px; height: 100vh; opacity: 0.07; transform: scaleX(-1); }

        .decor-center {
            top: 50%; left: 50%;
            width: 620px;
            transform: translate(-50%, -50%);
            opacity: 0.025;
        }

        .decor-spore {
            position: fixed;
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
            filter: blur(0.5px);
            opacity: 0.4;
        }

        h1 {
            font-size: 2.5em;
            letter-spacing: 6px;
            color: #2c7a5c;
            text-shadow:
                0 0 3px #2c7a5c,
                0 0 10px rgba(23, 217, 163, 0.25);
            margin-bottom: 5px;
            position: relative;
            z-index: 1;
        }

        p {
            color: #4a6b62;
            position: relative;
            z-index: 1;
        }

        form {
            margin-top: 30px;
            display: inline-block;
            text-align: left;
            position: relative;
            z-index: 1;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 5px;
            letter-spacing: 1px;
            color: #b3c9c0;
            font-size: 0.9em;
            text-transform: uppercase;
        }

        input[type="text"], select {
            width: 220px;
            padding: 8px;
            border-radius: 2px;
            border: 1px solid #1f5b45;
            background: rgba(0, 20, 15, 0.5);
            color: #b3c9c0;
            font-family: 'Share Tech Mono', monospace;
        }

        input[type="text"]:focus, select:focus {
            outline: none;
            border-color: #2c7a5c;
        }

        button {
            background: transparent;
            color: #4a8a6e;
            border: 1px solid #1f5b45;
            padding: 12px 24px;
            font-family: 'Share Tech Mono', monospace;
            font-size: 0.9em;
            letter-spacing: 1px;
            border-radius: 2px;
            cursor: pointer;
            margin-top: 20px;
            transition: all 0.15s ease-in-out;
            position: relative;
            z-index: 1;
        }

        button:hover {
            background: rgba(224, 164, 88, 0.05);
            border-color: #6b5537;
            color: #a3835a;
        }
        @media (max-width: 600px) {
            h1 { font-size: 2em; letter-spacing: 3px; }
            .card-box img { width: 140px; }
            .oracle-row { flex-direction: column; }
            .decor { display: none; }
        }
    </style>
</head>
<body>
    <!-- decorative forest elements, dimmed so the space feels quiet before login -->

    <div class="decor decor-branch-tr">
        <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
            <path d="M200 10 C150 20 120 40 90 70 C70 90 60 110 40 120" stroke="#39ffb0" stroke-width="2" fill="none"/>
            <path d="M120 45 C110 30 100 20 85 15" stroke="#39ffb0" stroke-width="1.5" fill="none"/>
            <ellipse cx="85" cy="14" rx="10" ry="5" fill="#39ffb0" transform="rotate(-30 85 14)"/>
            <ellipse cx="42" cy="118" rx="12" ry="6" fill="#e0a458" transform="rotate(10 42 118)"/>
        </svg>
    </div>

    <div class="decor decor-branch-tl">
        <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
            <path d="M200 10 C150 20 120 40 90 70 C70 90 60 110 40 120" stroke="#e0a458" stroke-width="2" fill="none"/>
            <ellipse cx="85" cy="14" rx="10" ry="5" fill="#e0a458" transform="rotate(-30 85 14)"/>
        </svg>
    </div>

    <div class="decor decor-branch-bl">
        <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
            <path d="M200 10 C150 20 120 40 90 70 C70 90 60 110 40 120" stroke="#39ffb0" stroke-width="2" fill="none"/>
            <ellipse cx="42" cy="118" rx="12" ry="6" fill="#e0a458" transform="rotate(10 42 118)"/>
        </svg>
    </div>

    <div class="decor decor-leaf-tl">
        <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
            <path d="M10 90 C10 50 40 10 90 10 C90 50 60 90 10 90 Z" fill="#39ffb0"/>
        </svg>
    </div>

    <div class="decor decor-leaf-br">
        <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
            <path d="M10 90 C10 50 40 10 90 10 C90 50 60 90 10 90 Z" fill="#e0a458"/>
        </svg>
    </div>

    <div class="decor decor-leaf-tr2">
        <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
            <path d="M10 90 C10 50 40 10 90 10 C90 50 60 90 10 90 Z" fill="#e0a458"/>
        </svg>
    </div>

    <div class="decor decor-leaf-bl2">
        <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
            <path d="M10 90 C10 50 40 10 90 10 C90 50 60 90 10 90 Z" fill="#39ffb0"/>
        </svg>
    </div>

    <div class="decor decor-mushroom-bl">
        <svg viewBox="0 0 80 100" xmlns="http://www.w3.org/2000/svg">
            <path d="M5 45 C5 15 75 15 75 45 C55 35 25 35 5 45 Z" fill="#e0a458"/>
            <rect x="32" y="45" width="16" height="45" rx="6" fill="#d8cba8"/>
        </svg>
    </div>

    <div class="decor decor-mushroom-br">
        <svg viewBox="0 0 80 100" xmlns="http://www.w3.org/2000/svg">
            <path d="M5 45 C5 15 75 15 75 45 C55 35 25 35 5 45 Z" fill="#39ffb0"/>
            <rect x="32" y="45" width="16" height="45" rx="6" fill="#d8cba8"/>
        </svg>
    </div>

    <div class="decor decor-vine-left">
        <svg viewBox="0 0 40 400" xmlns="http://www.w3.org/2000/svg">
            <path d="M20 0 C 5 60, 35 120, 20 180 C 5 240, 35 300, 20 400" stroke="#39ffb0" stroke-width="1.5" fill="none"/>
            <circle cx="12" cy="60" r="4" fill="#39ffb0"/>
            <circle cx="30" cy="140" r="4" fill="#e0a458"/>
            <circle cx="12" cy="230" r="4" fill="#39ffb0"/>
            <circle cx="30" cy="320" r="4" fill="#e0a458"/>
        </svg>
    </div>

    <div class="decor decor-vine-right">
        <svg viewBox="0 0 40 400" xmlns="http://www.w3.org/2000/svg">
            <path d="M20 0 C 5 60, 35 120, 20 180 C 5 240, 35 300, 20 400" stroke="#e0a458" stroke-width="1.5" fill="none"/>
            <circle cx="12" cy="90" r="4" fill="#e0a458"/>
            <circle cx="30" cy="170" r="4" fill="#39ffb0"/>
            <circle cx="12" cy="270" r="4" fill="#e0a458"/>
        </svg>
    </div>

    <!-- large faint rune, barely visible, centered behind the form -->
    <div class="decor decor-center">
        <svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
            <circle cx="200" cy="200" r="190" stroke="#39ffb0" stroke-width="1" fill="none"/>
            <circle cx="200" cy="200" r="150" stroke="#e0a458" stroke-width="1" fill="none"/>
            <circle cx="200" cy="200" r="110" stroke="#39ffb0" stroke-width="1" fill="none"/>
            <polygon points="200,20 356,290 44,290" stroke="#39ffb0" stroke-width="1" fill="none"/>
            <polygon points="200,380 44,110 356,110" stroke="#e0a458" stroke-width="1" fill="none"/>
            <circle cx="200" cy="200" r="4" fill="#39ffb0"/>
        </svg>
    </div>

    <!-- faint scattered particles, dimmer than the main app -->
    <div class="decor-spore" style="top:15%; left:15%; width:3px; height:3px; background:#39ffb0; box-shadow:0 0 4px #39ffb0;"></div>
    <div class="decor-spore" style="top:25%; left:80%; width:2px; height:2px; background:#e0a458; box-shadow:0 0 3px #e0a458;"></div>
    <div class="decor-spore" style="top:60%; left:12%; width:2px; height:2px; background:#39ffb0; box-shadow:0 0 3px #39ffb0;"></div>
    <div class="decor-spore" style="top:70%; left:88%; width:3px; height:3px; background:#e0a458; box-shadow:0 0 4px #e0a458;"></div>
    <div class="decor-spore" style="top:88%; left:35%; width:2px; height:2px; background:#39ffb0; box-shadow:0 0 3px #39ffb0;"></div>

    <h1>Taro</h1>
    <p>Enter your details to begin your reading.</p>

    <form action="/login" method="POST">
        <label for="user_name">Name</label>
        <input type="text" id="user_name" name="user_name" required>

        <label for="gender">Gender</label>
        <select id="gender" name="gender">
            <option value="man">Man</option>
            <option value="woman">Woman</option>
        </select>

        <br>
        <button type="submit">Enter</button>
    </form>
</body>
</html>
