{% macro card_box(card, label) %}
<div class="card-box">
    {% if card.image_filename %}
    <img src="{{ url_for('static', filename=card.image_filename) }}" alt="{{ card.card_name }}">
    {% endif %}
    <div class="card-name">{{ tr(card.card_name) }} ({{ t(card.orientation) }})</div>
    <div class="card-meaning">{{ tr(card.meaning) }}</div>
    <div class="card-category">{{ t(label) }}</div>
</div>
{% endmacro %}
